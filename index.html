    <title>마트 대소동! 카트 레이싱</title>
    <meta name="description" content="거대한 마트를 쥐만 한 카트로 질주! 여사님이 되어 직원들의 공격을 피해 1등으로 골인하세요.">
    <meta property="og:title" content="마트 대소동! 카트 레이싱">

  <body>
    <!-- In-app browsers (Instagram, KakaoTalk, Facebook...) block fullscreen and are short on memory:
         bounce to the real browser where possible, otherwise explain how to get there. -->
    <div id="inapp" style="display:none;position:fixed;inset:0;z-index:99;background:#1b1b1b;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:28px;box-sizing:border-box;flex-direction:column;justify-content:center;align-items:center;gap:14px">
      <img src="icon.png" alt="" style="width:96px;height:96px;border-radius:22px">
      <h2 style="margin:4px 0;font-size:22px;color:#ffc20e">마트 대소동! 카트 레이싱</h2>
      <p id="inapp-msg" style="margin:0;font-size:15px;line-height:1.6;max-width:420px"></p>
      <button id="inapp-copy" style="font-size:16px;font-weight:700;padding:12px 22px;border:0;border-radius:12px;background:#ffc20e;color:#222">링크 복사하기</button>
      <button id="inapp-stay" style="font-size:13px;padding:8px 14px;border:1px solid #666;border-radius:10px;background:none;color:#bbb">그래도 여기서 하기</button>
    </div>
    <script>
      (function () {
        var ua = navigator.userAgent, url = location.href.split("#")[0];
        if (!/Instagram|FBAN|FBAV|KAKAOTALK|NAVER\(inapp|Line\/|DaumApps|everytimeApp|Twitter|TikTok|musical_ly/i.test(ua)) return;
        var android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
        if (/KAKAOTALK/i.test(ua)) { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); }
        else if (android) { location.href = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end"; }
        var box = document.getElementById("inapp");
        document.getElementById("inapp-msg").innerHTML = ios
          ? "인스타·카톡 같은 앱 안에서는 게임이 제대로 안 돌아가요.<br><b>오른쪽 위 ⋯ 버튼 → '외부 브라우저에서 열기'</b>를 눌러<br>Safari에서 열어주세요."
          : "앱 안 브라우저에서는 게임이 제대로 안 돌아가요.<br><b>오른쪽 위 ⋮ 버튼 → '다른 브라우저로 열기'</b>를 눌러<br>Chrome에서 열어주세요.";
        box.style.display = "flex";
        document.getElementById("inapp-copy").onclick = function () {
          var b = this;
          (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { b.textContent = "복사됐어요! 브라우저 주소창에 붙여넣으세요"; },
            function () { prompt("이 링크를 복사해서 브라우저에 붙여넣으세요", url); });
        };
        document.getElementById("inapp-stay").onclick = function () { box.style.display = "none"; };
      })();
    </script>

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

                (function () {
